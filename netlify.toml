[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sick-leaves/inquiry*"
  to = "/.netlify/functions/inquiry"
  status = 200

[[redirects]]
  from = "/api/inquiry*"
  to = "/.netlify/functions/inquiry"
  status = 200

[[redirects]]
  from = "/api/sick-leaves/sync*"
  to = "/.netlify/functions/sick-leaves"
  status = 200

[[redirects]]
  from = "/api/sick-leaves/*"
  to = "/.netlify/functions/sick-leaves/:splat"
  status = 200

[[redirects]]
  from = "/api/sick-leaves*"
  to = "/.netlify/functions/sick-leaves"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
