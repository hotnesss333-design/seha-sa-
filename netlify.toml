[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "http://brilliant-kangaroo-9c201f.netlify.app/*"
  to = "https://brilliant-kangaroo-9c201f.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/.netlify/functions/inquiry*"
  to = "/security-unavailable.json"
  status = 410
  force = true

[[redirects]]
  from = "/.netlify/functions/sick-leaves*"
  to = "/security-unavailable.json"
  status = 410
  force = true

[[redirects]]
  from = "/*.php"
  to = "/security-unavailable.json"
  status = 410
  force = true

[[redirects]]
  from = "/data/*"
  to = "/security-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/*.zip"
  to = "/security-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/download*"
  to = "/security-unavailable.json"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, private"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
