[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# API routes (order matters: most specific first)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/sick-leaves/inquiry*"
  to = "/.netlify/functions/inquiry"
  status = 200

[[redirects]]
  from = "/api/inquiry*"
  to = "/.netlify/functions/inquiry"
  status = 200

[[redirects]]
  from = "/api/sick-leaves/sync*"
  to = "/.netlify/functions/sick-leaves"
  status = 200

[[redirects]]
  from = "/api/sick-leaves/*"
  to = "/.netlify/functions/sick-leaves/:splat"
  status = 200

[[redirects]]
  from = "/api/sick-leaves*"
  to = "/.netlify/functions/sick-leaves"
  status = 200

[[redirects]]
  from = "/api/users/login"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/account/loginv3"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/account/loginv3"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/users/:splat"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/Account/GetJWTUserToken"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/api/Account/GetJWTUserToken"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/Account/Logout"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/api/Account/Logout"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.userway.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.userway.org; connect-src 'self' https://cdn.userway.org wss://*.userway.org; frame-src 'self' https://*.userway.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
